# Uploads stein.json again to the latest stable release when the file in this repository changes (discord, news, the
# official mods in "sources"), without a new release. The Stein Client, the installer and the Loader in the game read
# it at releases/latest/download/stein.json. Also runs by hand (Actions > index > Run workflow).
name: index

on:
  push:
    branches: [main]
    paths: [stein.json]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload stein.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -e . stein.json >/dev/null
          bash .github/scripts/index.sh "$GITHUB_REPOSITORY" out.json
          mkdir upload && mv out.json upload/stein.json
          stable="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          gh release upload "$stable" upload/stein.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "stein.json of $stable:"; cat upload/stein.json
